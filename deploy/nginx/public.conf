# RETINA ADS-B Phase A — Q5 boundary option 3: PUBLIC TLS front, adsb.lol
# parity (ADR-0005 decision, 2026-09-05).
#
# The v2 query surface is reachable by anyone over HTTPS at the public
# hostname, exactly the way api.adsb.lol is — no client certificate, no
# private network. This is a RECORDED DIVERGENCE from AC-S-01 / AI-06
# ("no unauthenticated public exposure"), accepted by the project owner so
# adsb.lol-native nodes can switch base URL and nothing else. Mitigations
# that make it defensible, all in this file or in the serving-api:
#   * TLS only (Let's Encrypt); port 80 exists solely for the ACME challenge
#     and an HTTPS redirect.
#   * ONLY /v2/ and /health are proxied. /metrics, /livez and every other
#     path on the app listener are 404/403 from outside (spec §19/§21.3).
#   * Two independent rate limits: nginx limit_req/limit_conn per client
#     address below, and the serving-api's own per-client token bucket
#     (2 req/s, burst 10) keyed on the address THIS proxy appends to
#     X-Forwarded-For — requires 127.0.0.1 in rate_limit.trusted_proxies
#     in /etc/retina-adsb/serving.yaml (deploy/enable-public-front.sh does it).
#   * /v2/ requests are NOT access-logged: the URI carries a node's own
#     lat/lon, which is location data under the §21.5 governance policy.
#   * Host firewall default-deny with only 22/80/443 open
#     (deploy/enable-public-front.sh), verified by external scan (A3).
#   * CLOUDFLARE PROXY (the deployed mode, `--proxied`): the DNS record is
#     orange-cloud, so Cloudflare's edge terminates the public TLS session,
#     absorbs volumetric DDoS, hides the origin address, and connects to
#     this origin over TLS (set the zone's SSL mode to Full (strict)). The
#     enable script then (a) generates conf.d/retina-cloudflare-realip.conf
#     — `set_real_ip_from` for every published Cloudflare range plus
#     `real_ip_header CF-Connecting-IP` — so $remote_addr below is the real
#     node address for both rate limits and X-Forwarded-For, and (b)
#     restricts 80/443 in the firewall to those same ranges, so an attacker
#     who learns the origin IP cannot bypass the shield. Ranges are refreshed
#     from cloudflare.com/ips-v4|ips-v6 on every run (vendored fallback:
#     deploy/nginx/cloudflare-ips.txt) — re-run the script periodically.
#
# Enable with:  sudo deploy/enable-public-front.sh adsb.retina.fm --proxied
# (idempotent: installs this file, obtains/renews the certificate, opens the
# firewall, reloads nginx, verifies). Do NOT hand-edit the copy under
# /etc/nginx — edit this file and re-run the script.
#
# The upstream serving-api stays bound to 127.0.0.1:8080 either way; this
# proxy is the ONLY path in from outside the host.

# Per-client-address limits (http{} context; this file is included from
# conf.d so these directives are legal here). Sized above the app's own
# 2 req/s so the app's limiter — which returns the contract 429 with
# Retry-After — is the one clients normally meet; nginx only shields it
# from floods. 10 MB zone ≈ 160k tracked addresses.
limit_req_zone  $binary_remote_addr zone=retina_v2_req:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=retina_v2_conn:10m;
limit_req_status  429;
limit_conn_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # ACME HTTP-01 challenge (certbot --webroot); everything else → HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/retina-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/letsencrypt/live/__SERVER_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:retina_ssl:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # Requests for any other hostname (or the bare IP) are refused: this is
    # the only 443 server block, so nginx would otherwise route them here.
    if ($host != "__SERVER_NAME__") { return 421; }

    # Common proxy behavior, inherited by the proxied locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The app keys its token bucket on the RIGHTMOST X-Forwarded-For entry,
    # i.e. what THIS proxy sends — only because 127.0.0.1 is listed in
    # rate_limit.trusted_proxies (serving.yaml). We send exactly one entry,
    # $remote_addr, and never forward the inbound header: behind Cloudflare
    # $remote_addr is already the real client (realip from CF-Connecting-IP,
    # trusted only from Cloudflare's ranges); direct connections carry their
    # own peer address. Client-supplied XFF values therefore never reach the
    # app at all.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;
    # Never buffer the whole 32 MB worst-case envelope on disk.
    proxy_max_temp_file_size 0;

    # The v2 query surface — the only thing node clients need.
    location /v2/ {
        limit_req  zone=retina_v2_req  burst=20 nodelay;
        limit_conn retina_v2_conn 20;
        access_log off;   # §21.5: the URI is the node's own position
        proxy_pass http://127.0.0.1:8080;
    }

    # Health probe, allowed for clients. The app computes the /health
    # verdict at most once per second (1 s in-app cache), so external
    # probing cannot amplify load onto readsb.
    location = /health {
        limit_req zone=retina_v2_req burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }

    # Prometheus metrics are a monitoring surface, never a client surface
    # (spec §19/§21.3): loopback only, plus an explicitly named monitoring
    # network if Prometheus ever scrapes through this proxy.
    location = /metrics {
        allow 127.0.0.1;
        # allow 192.0.2.0/24;   # PLACEHOLDER: monitoring network CIDR
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # Everything else on the app listener does not exist externally.
    location / {
        return 404;
    }
}
