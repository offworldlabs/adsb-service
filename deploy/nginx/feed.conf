# RETINA ADS-B — account-less Beast contribution port, TCP 7444 (ADR-0008).
#
# nginx stream{} context. NOT ENABLED BY install.sh. Installed by
# deploy/enable-feed-port.sh as /etc/nginx/retina-stream.d/retina-adsb-feed.conf
# (the script adds `stream { include /etc/nginx/retina-stream.d/*.conf; }` to
# nginx.conf and installs libnginx-mod-stream). Placeholders __X__ are
# substituted by the script; nothing here is meant to be hand-edited on the host.
#
# One public port, two wire forms, auto-detected from the first bytes
# (ssl_preread looks for a TLS ClientHello; a Beast stream starts with 0x1A):
#
#   * plain TCP Beast — exactly what a stock feeder sends with
#       readsb/dump1090 --net-connector=<host>,7444,beast_out
#     forwarded unchanged to the loopback readsb Beast listener;
#   * TLS with a SERVER certificate only (Let's Encrypt), NO client
#     certificate, NO account — terminated at the loopback server below, then
#     forwarded the same way. For feeders that want the stream private in
#     transit (stunnel/socat in front of the same --net-connector).
#
# Either way the feeder's real address reaches readsb in a PROXY protocol v1
# header ("PROXY TCP4 <client> ..."), which readsb parses under --net-ingest
# (vendor/readsb/net_io.c readProxy) — per-feeder receiver ids, rate limits
# and garbage disconnects key on the feeder, not on 127.0.0.1.
#
# Abuse bounds here (the spec §18 feed_gateway numbers, minus identity):
# connections per source address, bytes/s per connection, idle timeout, and a
# 65 s cap on how long a silent connection may sit in TLS detection. readsb
# adds per-feeder message/position rate limits, CPR garbage detection and
# --json-reliable=2 (two consistent positions before an aircraft is served).

# Per-source-address connection cap (spec §18 max_connections_per_node is 2
# per identity; without identity a NAT'd site with several receivers shares
# one address, so 4).
limit_conn_zone $binary_remote_addr zone=retina_feed_conn:1m;

map $ssl_preread_protocol $retina_feed_upstream {
    # no ClientHello seen (plain Beast, or nothing within preread_timeout)
    ""       127.0.0.1:__BEAST_PORT__;
    # a TLS ClientHello: the loopback terminator below
    # (plain-only mode renders a closed port here, so TLS is simply refused)
    default  __TLS_UPSTREAM__;
}

server {
    listen 7444;
    listen [::]:7444;
    ssl_preread on;
    # nginx CLOSES a connection that sends nothing within preread_timeout
    # (verified 2026-09-06: a 5 s value dropped a feeder silent for 6.5 s). A
    # stock readsb/dump1090 feeder with no aircraft in range sends its first
    # Beast heartbeat after --net-heartbeat = 60 s, so allow 65 s; silent
    # socket-holders are bounded by limit_conn below, not by this timer.
    preread_timeout 65s;
    limit_conn retina_feed_conn 4;
    proxy_connect_timeout 2s;
    # spec §18 idle_timeout: no bytes either way for 90 s → close
    proxy_timeout 90s;
    # spec §18 max_bytes_per_second_per_node (1 MB/s per connection)
    proxy_upload_rate 1m;
    proxy_protocol on;
    proxy_pass $retina_feed_upstream;
    # Feeder addresses are not logged by nginx (§21.5 data governance);
    # readsb's --net-ingest journal lines and /run/readsb/clients.json carry
    # them for operations.
    access_log off;
}

# --tls-begin (removed by enable-feed-port.sh in plain-only mode)
server {
    # Loopback only: reachable solely through the 7444 front above, which
    # prefixes the real client address in a PROXY header.
    listen 127.0.0.1:__TLS_PORT__ ssl proxy_protocol;
    set_real_ip_from 127.0.0.1;     # $remote_addr := the PROXY header's client
    ssl_certificate     /etc/letsencrypt/live/__FEED_TLS_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FEED_TLS_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # ssl_verify_client stays at its default (off): no client certificate —
    # the recorded ADR-0008 divergence from spec §11.2 mutual TLS.
    proxy_timeout 90s;
    proxy_protocol on;
    proxy_pass 127.0.0.1:__BEAST_PORT__;
    access_log off;
}
# --tls-end
