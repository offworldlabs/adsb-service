# RETINA ADS-B Phase A — Q5 boundary option 1: mTLS front (DESIGN.md §1/§8).
#
# NOT ENABLED BY DEFAULT. install.sh never touches nginx; the serving stack
# ships with zero public ports (AC-S-01 satisfied by default-closed). This is
# the recommended Q5 answer, pending stakeholder decision: enable it only
# once client certificates for RETINA nodes/operators exist (pulls ADR #4,
# CA/enrollment, into scope).
#
# To enable (operator action, NOT automated):
#   1. Put the server cert/key and the client-CA bundle at the paths below.
#   2. cp deploy/nginx/mtls.conf /etc/nginx/sites-available/retina-adsb-mtls.conf
#      ln -s ../sites-available/retina-adsb-mtls.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. Open 443 in the host firewall yourself — nothing else opens it.
#
# The upstream serving-api stays bound to 127.0.0.1:8080 either way; this
# proxy is the ONLY path in from outside the host.

server {
    # TLS only. No plaintext listener exists for this surface.
    listen 443 ssl;
    listen [::]:443 ssl;

    # PLACEHOLDER: name this host actually serves as.
    server_name retina-adsb.example.invalid;

    # PLACEHOLDER paths — server identity presented to nodes/operators.
    ssl_certificate     /etc/retina-adsb/tls/server.crt;
    ssl_certificate_key /etc/retina-adsb/tls/server.key;

    # Mutual TLS: every client MUST present a certificate signed by this CA
    # (the RETINA node/operator CA — ADR #4). Requests without a valid client
    # cert are rejected during the handshake; nothing readsb-derived is
    # reachable unauthenticated (AC-S-01).
    ssl_client_certificate /etc/retina-adsb/tls/client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Rate limiting note: the serving-api already enforces an in-app token
    # bucket per client IP (2 req/s, burst 10 — sized for ~1 Hz node
    # polling; 429 + Retry-After on excess). For per-client keying behind
    # this proxy, list the proxy's address in rate_limit.trusted_proxies
    # (serving.yaml) so the app keys on the X-Forwarded-For entry this
    # proxy appends; additionally you MAY add an nginx-level limit keyed on
    # the client certificate instead of the IP, e.g. (http{} context):
    #   limit_req_zone $ssl_client_s_dn zone=retina_v2:10m rate=2r/s;
    # and inside location /v2/:
    #   limit_req zone=retina_v2 burst=10 nodelay;

    # ONLY the explicit surfaces below are reachable through this proxy.
    # A bare `location /` proxy would hand every authenticated node client
    # the app's whole listener — including /metrics — so each surface is
    # enumerated and everything else is a 404.

    # Common proxy behavior, inherited by the proxied locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Lets the in-app per-client token bucket key on the real client. The
    # app only honors this header when the proxy's OWN address is listed in
    # rate_limit.trusted_proxies in /etc/retina-adsb/serving.yaml (add
    # 127.0.0.1 for this same-host front); otherwise all proxied clients
    # collapse into one bucket keyed on the proxy's peer IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Client cert identity for authenticated request logs (never logged
    # by the app itself; §21.5).
    proxy_set_header X-Client-DN $ssl_client_s_dn;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;

    # The v2 query surface — the only thing node clients need.
    location /v2/ {
        proxy_pass http://127.0.0.1:8080;
        # limit_req zone=retina_v2 burst=10 nodelay;   # see note above
    }

    # Health probe, allowed for clients. The app computes the /health
    # verdict at most once per second (1 s in-app cache), so external
    # probing cannot amplify load onto readsb.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # Prometheus metrics are a monitoring surface, never a client surface
    # (spec §19/§21.3): loopback only, plus an explicitly named monitoring
    # network if Prometheus scrapes through this proxy.
    location = /metrics {
        allow 127.0.0.1;
        # allow 192.0.2.0/24;   # PLACEHOLDER: monitoring network CIDR
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # Everything else on the app listener does not exist externally.
    location / {
        return 404;
    }
}
