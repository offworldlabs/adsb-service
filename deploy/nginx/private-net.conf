# RETINA ADS-B Phase A — Q5 boundary option 2: private network + allowlist
# (DESIGN.md §1/§8).
#
# NOT ENABLED BY DEFAULT. install.sh never touches nginx; the serving stack
# ships with zero public ports (AC-S-01 satisfied by default-closed). This
# option relies on NETWORK isolation instead of client certificates: the v2
# surface is reachable only on a private interface (VPC/VPN/WireGuard) that
# already carries the RETINA nodes/operators, plus an address allowlist as a
# second layer. Weaker than mTLS (no per-client identity) — acceptable only
# if the private network's membership is itself controlled.
#
# To enable (operator action, NOT automated):
#   1. Replace the placeholder listen address and allowlist CIDRs below.
#   2. cp deploy/nginx/private-net.conf /etc/nginx/sites-available/retina-adsb-private.conf
#      ln -s ../sites-available/retina-adsb-private.conf /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. Ensure the host firewall still blocks this port on every PUBLIC
#      interface — nothing here may become Internet-reachable (AC-S-01).
#
# The upstream serving-api stays bound to 127.0.0.1:8080 either way; this
# proxy is the ONLY path in from off-host.

server {
    # PLACEHOLDER: the host's PRIVATE interface address (VPC/VPN/WireGuard).
    # Binding the specific address — never 0.0.0.0 — keeps this surface off
    # the public interface even before the firewall is considered.
    listen 10.0.0.10:8080;

    # PLACEHOLDER: the private network(s) the RETINA nodes/operators live in.
    # Everything else is refused, including anything that leaks through an
    # unexpected route.
    allow 10.0.0.0/24;
    deny all;

    # ONLY the explicit surfaces below are reachable through this proxy.
    # A bare `location /` proxy would hand every node on the private
    # network the app's whole listener — including /metrics — so each
    # surface is enumerated and everything else is a 404.

    # Common proxy behavior, inherited by the proxied locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Lets the serving-api's in-app token bucket (2 req/s, burst 10 per
    # client IP, ~1 Hz node polling) key on the real node address. The app
    # only honors this header when the proxy's OWN address is listed in
    # rate_limit.trusted_proxies in /etc/retina-adsb/serving.yaml (add
    # 127.0.0.1 for this same-host front); otherwise all proxied clients
    # collapse into one bucket keyed on the proxy's peer IP.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
    proxy_connect_timeout 2s;

    # The v2 query surface — the only thing node clients need.
    location /v2/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Health probe, allowed for clients. The app computes the /health
    # verdict at most once per second (1 s in-app cache), so external
    # probing cannot amplify load onto readsb.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
    }

    # Prometheus metrics are a monitoring surface, never a client surface
    # (spec §19/§21.3): loopback only, plus an explicitly named monitoring
    # network if Prometheus scrapes through this proxy.
    location = /metrics {
        allow 127.0.0.1;
        # allow 192.0.2.0/24;   # PLACEHOLDER: monitoring network CIDR
        deny all;
        proxy_pass http://127.0.0.1:8080;
    }

    # Everything else on the app listener does not exist externally.
    location / {
        return 404;
    }
}
